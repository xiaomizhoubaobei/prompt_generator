rules:
  - description: "禁止在代码变更中硬编码密钥或敏感信息"
    enabled: true
    severity: critical
    event_types: [ "pull_request" ]
    parameters:
      # 大小写不敏感 + 带边界/分隔符的精确匹配，避免漏报大写变体、误报宽泛子串
      security_patterns:
        - "(?i)api[_-]?key"
        - "(?i)(secret|private|access)[_/-]?key"
        - "(?i)(access|auth)[_/-]?token"
        - "(?i)(db|database)[_/-]?password"
  - description: "所有提交必须使用 GPG/SSH/S-MIME 签名"
    enabled: true
    severity: critical
    event_types: [ "pull_request" ]
    parameters:
      require_signed_commits: true
  - description: "禁止绕过 PR 直接推送到受保护分支，必须通过 PR 流程变更"
    enabled: true
    severity: critical
    event_types: [ "push" ]
    parameters:
      protected_branches: [ "main", "master" ]
  - description: "PR 标题必须符合 Conventional Commits 规范"
    enabled: true
    severity: high
    event_types: [ "pull_request" ]
    parameters:
      title_pattern: "^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\\(.+\\))?!?: .+"
