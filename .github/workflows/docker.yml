name: Docker 镜像构建与推送

on:
    push:
        branches:
            - main
        paths:
            - "src/**"
            - "Dockerfile"
    workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: 加固运行器（审计所有出站调用）
              uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
              with:
                  egress-policy: audit

            - name: 检出代码
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: 从 package.json 提取版本号
              id: version
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
                  echo "已提取版本: $VERSION"

            - name: 设置 Docker Buildx
              uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

            - name: 登录 DockerHub
              uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: 登录 GitHub 容器注册表
              uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: 提取依赖版本
              id: deps
              run: |
                  NODE_VERSION=$(node -v | sed 's/v//')
                  REACT_VERSION=$(node -p "require('./package.json').dependencies.react.replace('^', '')")
                  VITE_VERSION=$(node -p "require('./package.json').devDependencies.vite.replace('^', '')")
                  YARN_VERSION=$(yarn -v)
                  TYPESCRIPT_VERSION=$(node -p "require('./package.json').devDependencies.typescript.replace('^', '')")
                  echo "NODE_VERSION=$NODE_VERSION" >> $GITHUB_OUTPUT
                  echo "REACT_VERSION=$REACT_VERSION" >> $GITHUB_OUTPUT
                  echo "VITE_VERSION=$VITE_VERSION" >> $GITHUB_OUTPUT
                  echo "YARN_VERSION=$YARN_VERSION" >> $GITHUB_OUTPUT
                  echo "TYPESCRIPT_VERSION=$TYPESCRIPT_VERSION" >> $GITHUB_OUTPUT
                  echo "Node: $NODE_VERSION, React: $REACT_VERSION, Vite: $VITE_VERSION, Yarn: $YARN_VERSION, TypeScript: $TYPESCRIPT_VERSION"

            - name: Docker 元数据（主流容器注册表）
              id: meta
              uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
              with:
                images: |
                  ${{ secrets.DOCKERHUB_USERNAME }}/302_prompt_generator
                  ghcr.io/${{ github.repository }}
                # 关闭所有默认生成器
                flavor: |
                  latest=false
                # 只保留版本号标签
                tags: |
                  type=raw,value=${{ steps.version.outputs.VERSION }}

            - name: 获取基础镜像摘要（nginx:alpine）
              id: baseimg
              run: |
                  BASE_DIGEST=$(docker buildx imagetools inspect nginx:alpine --format '{{.Manifest.Digest}}' 2>/dev/null || echo "")
                  echo "BASE_DIGEST=$BASE_DIGEST" >> $GITHUB_OUTPUT
                  echo "基础镜像 nginx:alpine 摘要: $BASE_DIGEST"

            - name: 构建并推送（主流容器注册表，支持 OCI）
              id: build
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                context: .
                platforms: linux/amd64,linux/arm64
                push: true
                tags: ${{ steps.meta.outputs.tags }}
                labels: |
                  org.opencontainers.image.source=https://github.com/xiaomizhoubaobei/LLM-Playground
                  org.opencontainers.image.url=https://github.com/xiaomizhoubaobei/LLM-Playground
                  org.opencontainers.image.documentation=https://github.com/xiaomizhoubaobei/LLM-Playground#readme
                  org.opencontainers.image.description=LLM Playground - 一个用于测试和实验大语言模型的交互式平台
                  org.opencontainers.image.licenses=AGPL-3.0
                  org.opencontainers.image.title=LLM Playground
                  org.opencontainers.image.maintainer=祁筱欣
                  org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
                  org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
                  org.opencontainers.image.revision=${{ github.sha }}
                  org.opencontainers.image.vendor=xiaomizhoubaobei
                  org.opencontainers.image.ref.name=302_prompt_generator:${{ steps.version.outputs.VERSION }}
                  org.opencontainers.image.base.name=nginx:alpine
                  org.opencontainers.image.base.digest=${{ steps.baseimg.outputs.BASE_DIGEST }}
                  org.opencontainers.image.authors=祁筱欣 <qixiaoxin@stu.sqxy.esu.cn>
                  build.url=https://github.com/xiaomizhoubaobei/LLM-Playground/actions/runs/${{ github.run_id }}
                  dependencies.node=${{ steps.deps.outputs.NODE_VERSION }}
                  org.opencontainers.image.react=${{ steps.deps.outputs.REACT_VERSION }}
                  org.opencontainers.image.vite=${{ steps.deps.outputs.VITE_VERSION }}
                  org.opencontainers.image.yarn=${{ steps.deps.outputs.YARN_VERSION }}
                  org.opencontainers.image.typescript=${{ steps.deps.outputs.TYPESCRIPT_VERSION }}
                cache-from: type=gha
                cache-to: type=gha,mode=max
                provenance: true

            - name: 安装 cosign
              uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

            - name: 使用 cosign 签名镜像（无密钥模式）
              env:
                  COSIGN_EXPERIMENTAL: "1"
              run: |
                  echo "使用 cosign 无密钥模式签名镜像..."
                  while IFS= read -r tag; do
                      echo "正在签名 $tag"
                      cosign sign --yes "$tag"
                  done <<< "${{ steps.meta.outputs.tags }}"

            - name: 证明 DockerHub 镜像
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                subject-name: index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/302_prompt_generator
                subject-digest: ${{ steps.build.outputs.digest }}
                push-to-registry: true

            - name: 证明 GHCR 镜像
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                subject-name: ghcr.io/${{ github.repository }}
                subject-digest: ${{ steps.build.outputs.digest }}
                push-to-registry: true
