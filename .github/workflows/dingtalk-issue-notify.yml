# =============================================================================
# Issue 开启钉钉通知
# =============================================================================
# 用途：当仓库有新 Issue 被创建(open)时，自动向钉钉群机器人发送一条通知消息，
#       让维护者第一时间感知新问题 / 需求 / 建议，无需守着仓库刷新。
#       通知采用钉钉 actionCard 卡片消息呈现（标题/提交者/详情/时间分条渲染，
#       并附「前往查看」按钮一键直达 Issue 页面），观感上是一整张结构化卡片，
#       比纯 markdown 文本通知更利于阅读与定位。
#
# 触发设计：
#   - issues.types: [opened]：仅监听「新建 Issue」事件，避免 reopened / closed 等
#     其它状态反复打扰（如需监听 reopen，可在 types 中追加 reopened）。
#   - workflow_dispatch：保留手动触发，便于首次部署时人工验证链路是否打通。
#
# 安全与最小权限：
#   - 顶层 GITHUB_TOKEN 仅授予 contents: read；本工作流不读写代码，只消费事件
#     载荷里的 Issue 信息并外发到钉钉。
#   - 钉钉 Webhook 与加签密钥均从仓库 Secrets 读取（绝不硬编码进源码），且只在
#     真正执行发送的唯一 step（step 级 env）注入，收敛凭据暴露面。
#
# 所需 Secrets（仓库 Settings → Secrets and variables → Actions）：
#   - DINGTALK_WEBHOOK  必填，钉钉群机器人 Webhook 完整地址
#                       形如 https://oapi.dingtalk.com/robot/send?access_token=xxxx
#   - DINGTALK_SECRET   必填，钉钉自定义机器人「安全设置 → 加签」里的 SEC 密钥，
#                       用于 HMAC-SHA256 生成签名 sign = urlencode(base64(hmac(timestamp\nsecret)))
#
# 钉钉加签说明：机器人若启用「加签」，每次请求需携带 timestamp 与 sign；本工作流
# 用 python3（GitHub 官方 runner 自带）按钉钉官方示例实现签名，不引入第三方依赖。
# =============================================================================

name: Issue 开启钉钉通知

on:
  issues:
    types: [opened]
  workflow_dispatch: # 便于手动验证链路

permissions:
  contents: read

jobs:
  dingtalk-notify:
    name: 发送钉钉通知
    runs-on: ubuntu-latest
    # 仅监听「新建 Issue」或「手动触发」，其它情况直接跳过
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.action == 'opened'

    steps:
      # 加固运行器（audit 模式：记录所有出站调用，便于事后审计）
      - name: 加固运行器（审计所有出站调用）
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # 向钉钉群发送「新建 Issue」通知
      # 凭据仅在真正执行发送的唯一 step 注入（step 级 env），其余步骤不暴露。
      # 若 Secrets 未配置则打印提示并以 0 退出（幂等跳过），不中断流水线。
      - name: 发送钉钉「新建 Issue」通知
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          # 手动触发时没有真实 Issue 事件，以下字段可为空，走默认文案
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_LABELS: ${{ toJSON(github.event.issue.labels) }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_USER_URL: ${{ github.event.issue.user.html_url }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import os, re, time, hmac, hashlib, base64, urllib.parse, urllib.request, json
          from datetime import datetime, timezone

          webhook = os.environ.get('DINGTALK_WEBHOOK', '')
          secret = os.environ.get('DINGTALK_SECRET', '')
          if not webhook or not secret:
              print("提示：尚未配置 DINGTALK_WEBHOOK / DINGTALK_SECRET，跳过发送（幂等）")
              raise SystemExit(0)

          repo = os.environ.get('REPO_NAME', 'unknown/repo')
          num = os.environ.get('ISSUE_NUMBER', '')
          url = os.environ.get('ISSUE_URL', '')

          # 对外部可控的 Issue 字段做统一清洗与长度限制，避免超长 / 含控制字符的
          # 内容直接灌入钉钉（superagent P1：任意 Issue 作者可控 title/body/user）。
          # 说明：字段经环境变量传入，无 shell 拼接，不构成命令注入；此处主要防
          # 钉钉推送被滥用（内容超长、换行/控制字符混淆）与刷屏。
          # 先剥控制字符并把首尾/连续空白折叠成单行；截断时尽量在词边界断开并补
          # 省略号「…」，避免把标题/字段拦腰截断成半截符号或单词。
          def _clean(value, limit):
              if not value:
                  return ''
              value = re.sub(r'[\x00-\x1f\x7f]', ' ', value)
              value = re.sub(r'\s+', ' ', value).strip()
              if len(value) <= limit:
                  return value
              cut = value[:limit]
              # 仅在存在空白且回退点不算太靠前时才回退到最近空白，防止过度压缩
              ws = cut.rfind(' ')
              if ws > 0 and ws >= int(limit * 0.5):
                  cut = cut[:ws]
              return cut + '…'

          # 把 Issue 正文（多为 AI 审计生成、含大量 markdown 结构）清洗成「干净的单行
          # 纯文本预览」：保留可读内容，剥掉标题井号/列表符/表格竖线与分隔行/代码反引号/
          # 粗斜体星号/行内链接等结构噪声，避免整套 markdown 语法符号被压成一行「符号汤」，
          # 让钉钉卡片里的「详情」一眼可读。
          def _plain_preview(value, limit):
              if not value:
                  return ''
              kept = []
              for line in value.splitlines():
                  line = re.sub(r'[\x00-\x1f\x7f]', ' ', line)
                  line = line.strip()
                  if not line:
                      continue
                  # 跳过纯装饰行：水平分隔线(---/***)与表格分隔行(|---|---|/|:--|:--|)
                  stripped = line.strip('|: -')
                  if stripped == '' and (line.count('-') > 2 or line.count('*') > 2 or '|' in line):
                      continue
                  # 表格数据行剥掉首尾竖线，内部竖线统一转成分隔点「·」
                  if line.startswith('|') and line.endswith('|'):
                      line = line.strip('|')
                  # 去掉行首 markdown 修饰：标题井号、引用、无序/有序列表符
                  line = re.sub(r'^\s*(#{1,6}\s*|>\s+|[-+*]\s+|\d+[.)]\s+)', '', line)
                  # 去掉行内链接/图片，保留其显示文字或 alt
                  line = re.sub(r'!\[([^\]]*)\]\([^)]*\)', r'\1', line)
                  line = re.sub(r'\[([^\]]*)\]\([^)]*\)', r'\1', line)
                  # 去掉行内代码反引号、粗/斜体星号、下划线强调与行内 HTML 标签
                  line = re.sub(r'`+', '', line)
                  line = line.replace('**', '').replace('__', '').replace('*', '').replace('_', '')
                  line = re.sub(r'<[^>]+>', '', line)
                  # 其余残留竖线（表格单元分隔）替换为分隔点，再折叠空白
                  line = line.replace('|', ' · ')
                  line = re.sub(r'\s+', ' ', line).strip(' :')
                  if line:
                      kept.append(line)
              # 各清洗后的行以单空格衔接成一行，再统一做词边界截断
              return _clean(' '.join(kept), limit)

          title = _clean(os.environ.get('ISSUE_TITLE'), 80)
          body = _plain_preview(os.environ.get('ISSUE_BODY'), 300)
          user = _clean(os.environ.get('ISSUE_USER'), 30)

          # 解析 Issue 标签：github.event.issue.labels 是形如
          # [{"name":"bug","color":"d73a4a",...}, ...] 的 JSON 数组，仅取 name 展示。
          # workflow_dispatch 手动触发或 Issue 无标签时为空，此时不展示标签条目。
          labels_raw = os.environ.get('ISSUE_LABELS', '')
          labels = []
          if labels_raw and labels_raw.strip() != 'null':
              try:
                  parsed = json.loads(labels_raw)
                  if isinstance(parsed, list):
                      # 兼容字符串元素与对象元素两种形态，去重并限长
                      for item in parsed:
                          if isinstance(item, dict) and item.get('name'):
                              labels.append(_clean(str(item.get('name')), 30))
                          elif isinstance(item, str):
                              labels.append(_clean(item, 30))
              except Exception as e:
                  print("警告：解析 Issue labels 失败，将不展示标签：{}".format(e))
                  labels = []
          # 去重并限制展示数量（防止恶意堆叠大量标签刷屏）
          seen = []
          for lb in labels:
              if lb and lb not in seen:
                  seen.append(lb)
          labels = seen[:10]
          user_url = (os.environ.get('ISSUE_USER_URL') or '').strip()

          # 解析 Issue 打开时间（github.event.issue.created_at 为 ISO8601 UTC 时间），
          # 转成可读的「YYYY-MM-DD HH:MM:SS.mmm UTC」便于维护者判断该 Issue 的新旧与积压时长，
          # 时间精度保留到毫秒（github.event.issue.created_at 常为带小数秒的 ISO8601，如 ...123Z）。
          # 解析失败或缺失时置空，仅告警不阻断发送。
          created_at_raw = os.environ.get('ISSUE_CREATED_AT', '').strip()
          created_display = ''
          if created_at_raw:
              created_iso = created_at_raw
              # 兼容 Z 时区后缀：转成带偏移的 ISO8601 供 fromisoformat 解析
              if created_iso.endswith('Z'):
                  created_iso = created_iso[:-1] + '+00:00'
              created_dt = None
              try:
                  # 优先完整解析（含小数秒），以保留真实毫秒精度
                  created_dt = datetime.fromisoformat(created_iso)
              except ValueError:
                  # 旧版 fromisoformat 无法解析小数秒时降级：去掉小数秒再解析，
                  # 此时无法拿到真实毫秒，展示时毫秒按 .000 处理。
                  head, dot, tail = created_iso.partition('.')
                  if dot:
                      # tail 可能带着 +00:00 / +0000 时区后缀，需保留
                      tz_idx = tail.find('+')
                      if tz_idx < 0:
                          tz_idx = tail.find('-', 1)
                      tz = tail[tz_idx:] if tz_idx >= 0 else ''
                      created_iso_no = head + tz
                  else:
                      created_iso_no = created_iso
                  try:
                      created_dt = datetime.fromisoformat(created_iso_no)
                  except Exception as e:
                      print("警告：解析 Issue created_at 失败，将不展示时间：{}".format(e))
              if created_dt is not None:
                  # 统一转成 UTC 展示，避免时区歧义
                  if created_dt.tzinfo is not None:
                      created_dt = created_dt.astimezone(timezone.utc)
                  # 带上毫秒：%f 为微秒(6位)，截前 3 位作为毫秒
                  created_display = created_dt.strftime('%Y-%m-%d %H:%M:%S.%f')[:-3] + ' UTC'

          # 组装「新建 Issue」通知（actionCard 卡片消息：逐字段分行加粗排版，清晰可读）。
          # 标题已放入 actionCard.title，因此卡片正文不再重复 markdown 标题，直接从
          # 字段清单开始，每条以「**字段：**值」分行渲染，观感是一张结构化信息卡片。
          card_lines = []
          if num and title:
              if repo:
                  # 顶部加仓库归属行：钉钉卡片标题虽已含仓库，正文再标一次，
                  # 便于截图/转发给他人时仍能一眼看出来源仓库（多仓库共用一个机器人时尤为重要）
                  card_lines.append("**仓库：**{}".format(repo))
              if user:
                  # 提交者以普通文本 + 可点击主页链接呈现（钉钉机器人无法真正 @ 到人，
                  # 故不再使用无效的 @ 前缀；附主页链接便于维护者一键溯源是谁提的 Issue）
                  if user_url:
                      card_lines.append("**提交者：**[{}]({})".format(user, user_url))
                  else:
                      card_lines.append("**提交者：**{}".format(user))
              if labels:
                  # 以等宽反引号包裹每个标签名，直观展示 Issue 归属类别
                  card_lines.append("**标签：**{}".format(' '.join('`{}`'.format(lb) for lb in labels)))
              if body:
                  # 正文折叠为单行摘要，避免超长/换行撑爆卡片排版
                  card_lines.append("**详情：**{}".format(body))
              if created_display:
                  # 标注 Issue 打开时间，便于判断该问题的新旧与积压时长
                  card_lines.append("**时间：**{}".format(created_display))
          else:
              card_lines.append("> 手动触发生成的示例通知（无真实 Issue 载荷）")
          card_text = "\n".join(card_lines)
          card_title = "【{}】新 Issue #{}".format(repo, num) if (num and title) else "【{}】新 Issue 通知".format(repo)
          # Issue 直达链接（真实 Issue 必带；手动触发/缺失时为空，则不挂跳转按钮）
          issue_url = (url or '').strip()

          # 钉钉加签：timestamp = 毫秒级时间戳；sign = urlencode(base64(hmac_sha256(timestamp\nsecret, secret)))
          timestamp = str(round(time.time() * 1000))
          secret_enc = secret.encode('utf-8')
          string_to_sign = '{}\n{}'.format(timestamp, secret)
          hmac_code = hmac.new(secret_enc, string_to_sign.encode('utf-8'),
                               digestmod=hashlib.sha256).digest()
          sign = urllib.parse.quote_plus(base64.b64encode(hmac_code))

          # webhook 可能已含 ?access_token=xx，需用 & 追加 timestamp/sign
          sep = '&' if '?' in webhook else '?'
          target = '{}{}timestamp={}&sign={}'.format(webhook, sep, timestamp, sign)

          # 以 actionCard 卡片消息发送：钉钉渲染成一整张带标题正文的卡片，并可挂
          # 「前往查看 Issue」跳转按钮，点击即可直达 Issue 页面；相比纯 markdown 文本，
          # 卡片观感更清晰、定位更直接。url 缺失（如手动触发）时不挂按钮，仅展示卡片。
          card_payload = {"msgtype": "actionCard", "actionCard": {"title": card_title, "text": card_text}}
          if issue_url:
              btn_label = "前往查看 Issue #{}".format(num) if num else "前往查看"
              card_payload["actionCard"]["singleTitle"] = btn_label
              card_payload["actionCard"]["singleURL"] = issue_url
          payload = json.dumps(card_payload).encode('utf-8')
          req = urllib.request.Request(target, data=payload,
                                       headers={'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  result = json.loads(resp.read().decode('utf-8'))
                  if result.get('errcode') == 0:
                      print("钉钉通知发送成功：errcode=0 errmsg={}".format(result.get('errmsg')))
                  else:
                      # 服务端返回非 0 业务错误（如 access_token 失效、加签错误），
                      # 说明 Secret 配置有问题，应暴露为失败便于排查。
                      print("钉钉返回错误：{}".format(result))
                      raise SystemExit(1)
          except urllib.error.HTTPError as e:
              # HTTP 层非 2xx（如 4xx/5xx），读出响应体便于定位
              detail = ""
              try:
                  detail = e.read().decode('utf-8')
              except Exception:
                  pass
              print("钉钉 HTTP 错误：{} {}".format(e.code, detail))
              raise SystemExit(1)
          except urllib.error.URLError as e:
              # 网络不可达 / 域名解析失败 / 超时：给出可读提示并失败退出，
              # 便于人工判断是瞬时抖动（可重试）还是 Webhook 地址配置有误。
              reason = getattr(e, 'reason', e)
              print("钉钉网络错误（请检查 Webhook 地址或网络连通性）：{}".format(reason))
              raise SystemExit(1)
          except Exception as e:
              # 其它未知异常兜底，避免 Python 裸堆栈直接把流水线刷红、难以定位
              print("发送钉钉通知时发生未知异常：{}".format(e))
              raise SystemExit(1)
          EOF
