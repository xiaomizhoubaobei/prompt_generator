# =============================================================================
# Issue 自动分类（复用 AI 审计环境变量）
# =============================================================================
# 用途：当仓库新建/重开 Issue，或在受信任成员对 Issue 评论「@iflow-cli /triage」
#       时，自动对 Issue 做智能分类并打上合适的标签，替代人工逐个打标。
#
# 设计说明（复用已有 AI 审计环境变量）：
#   参考 https://github.com/xiaomizhoubaobei/LLM-Playground/blob/main/.github/
#   workflows/issue-triage.yml 的分类工作流，将其引入本仓库，
#   **不新增任何独立密钥**，直接复用本仓库已在 .github/workflows/
#   ai-audit-scheduled.yml 中落地并配置好的「AI 审计」环境变量作为分类所用
#   大模型的接入配置：
#     - AI_API_ENDPOINT  上游 base_url（OpenAI 兼容口，如 https://api.deepseek.com/v1）
#     - AI_API_TOKEN     对应厂商 API Key
#     - AI_MODEL_NAME    实际调用模型名（如 deepseek-v4-flash / qwen-max / kimi-k2）
#
# 触发设计：
#   - issues: opened / reopened：新 Issue 或重开的 Issue 自动分类。
#   - issue_comment: created：仅当受信任成员（OWNER/MEMBER/COLLABORATOR）评论中
#     含「@iflow-cli /triage」才触发，避免任意外部用户借机消耗模型配额。
#   - workflow_dispatch：保留手动触发，便于首次部署时验证链路与指定 issue_number。
#
# 安全与最小权限（依据 superagent-security 评审意见整改，拆分为两阶段）：
#   - 阶段一「AI 纯分类」：由 python3 + 标准库 urllib 直接调用 OpenAI 兼容
#     chat/completions 分类接口。该 step **不注入任何 GITHUB_TOKEN / 写凭据**，
#     也不让 AI 执行 shell 或 gh 命令，AI 仅据白名单输出建议标签，故不可信 issue
#     文本即便含提示注入也只能影响「建议了哪些标签」，无法触发任何仓库写操作。
#     AI 审计三件套（端点/令牌/模型名）仅在真正执行分类的这一 step 以 env 注入，
#     不额外声明为顶层/作业环境变量，收敛凭据暴露面。
#   - 阶段二「确定性打标」：普通 bash 读取分类结果，先与内嵌「标签白名单」逐项
#     精确比对，再与仓库 `gh label list` 实际标签集合比对；仅对同时命中白名单与
#     仓库的标签，按清单固定颜色（常量，不受 AI 输出影响）确定性创建/应用。bash
#     打标逻辑不解析不可信文本里的任何指令，只遍历白名单做布尔匹配，杜绝字符串
#     注入，故可安全持有 issues: write 的最小写权限。
#   - 顶层权限仅 contents: read；issues: write 收敛到 triage job 级（打标所需）；
#     移除工作流未用到的 statuses 写权限。
#   - 第三方 Actions 一律锁定到已复核的不可变 commit SHA，禁用浮动 tag。
#
# 所需 Secrets（仓库 Settings → Secrets and variables → Actions）：
#   - AI_API_ENDPOINT 必填，同 AI 审计，OpenAI 兼容 base_url
#   - AI_API_TOKEN    必填，同 AI 审计，模型厂商 API Key
#   - AI_MODEL_NAME   必填，同 AI 审计，分类所用模型名
#   （无需 IFLOW_API_KEY；GITHUB_TOKEN 由 Actions 自动注入，仅阶段二打标使用）
# =============================================================================

name: '🏷️ Issue 自动分类（复用 AI 审计模型）'

on:
  issues:
    types:
      - 'opened'
      - 'reopened'
  issue_comment:
    types:
      - 'created'
  workflow_dispatch:
    inputs:
      issue_number:
        description: '要分类的 issue 编号'
        required: true
        type: 'number'

concurrency:
  group: '${{ github.workflow }}-${{ github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

# 顶层仅授予只读 contents（检出仓库供分类提示词分析使用）；打标所需的 issues
# 写权限收敛到下方 triage job 级，避免第三方/被注入步骤在缺省令牌写能力下被利用。
permissions:
  contents: 'read'

jobs:
  triage-issue:
    if: |-
      github.event.sender.type != 'Bot' && (
        github.event_name == 'issues' ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@iflow-cli /triage') &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
        )
      )
    runs-on: 'ubuntu-latest'
    # 本 job 才需要 issues 写权限（仅阶段二确定性打标使用 gh 时授予）。
    permissions:
      contents: 'read'
      issues: 'write'
    steps:
      # 加固运行器（audit 模式：记录所有出站调用，便于事后审计）
      - name: 加固运行器（审计所有出站调用）
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # -------------------------------------------------------------------------
      # 阶段一：AI 纯分类（python3 + urllib 直连 OpenAI 兼容接口，仅做推理）
      #   · 不注入 GITHUB_TOKEN，不给任何 agent 执行 shell/gh 的能力；
      #   · AI 审计凭据仅在本 step 注入；issue 标题/正文仅作为只读文本送入，
      #     即便被提示注入也只能左右「建议标签」，无法触发仓库写操作；
      #   · 结果只保留命中白名单的标签名，写入共享临时文件供阶段二使用。
      # -------------------------------------------------------------------------
      - name: 'AI 分类 Issue（仅推理，不持有写凭据）'
        id: 'ai_triage'
        env:
          AI_API_ENDPOINT: '${{ secrets.AI_API_ENDPOINT }}'
          AI_API_TOKEN: '${{ secrets.AI_API_TOKEN }}'
          AI_MODEL_NAME: '${{ secrets.AI_MODEL_NAME }}'
          ISSUE_TITLE: '${{ github.event.issue.title }}'
          ISSUE_BODY: '${{ github.event.issue.body }}'
          ISSUE_NUMBER: '${{ github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request

          # 标签白名单常量（名称→颜色）。此清单为权威来源，供下方 AI 提示与阶段二
          # bash 校验共用，保证标签名与颜色硬编码、稳定、跨 issue 打标一致，且不
          # 允许 AI 自创标签或颜色。
          LABELS = [
              {"name": "bug", "color": "#d73a4a"},
              {"name": "enhancement", "color": "#a2eeef"},
              {"name": "feature", "color": "#1d76db"},
              {"name": "documentation", "color": "#0075ca"},
              {"name": "security", "color": "#b60205"},
              {"name": "question", "color": "#d876e3"},
              {"name": "good first issue", "color": "#1f883d"},
              {"name": "help wanted", "color": "#6f42c1"},
              {"name": "duplicate", "color": "#cfd3d7"},
              {"name": "invalid", "color": "#ffffff"},
              {"name": "wontfix", "color": "#6e5494"},
              {"name": "prompt", "color": "#008672"},
              {"name": "framework", "color": "#fbca04"},
              {"name": "custom", "color": "#7e4aff"},
              {"name": "ui", "color": "#7057ff"},
              {"name": "models", "color": "#5319e7"},
              {"name": "config", "color": "#e4e669"},
              {"name": "i18n", "color": "#1d76db"},
              {"name": "agent", "color": "#d35400"},
              {"name": "ai-audit", "color": "#ededed"},
              {"name": "docker", "color": "#0969da"},
              {"name": "deploy", "color": "#0f7fb8"},
              {"name": "ci", "color": "#8250df"},
              {"name": "license", "color": "#bfd4f2"},
              {"name": "supply-chain", "color": "#168700"},
              {"name": "code-scanning", "color": "#e99695"},
              {"name": "p0", "color": "#b60205"},
              {"name": "p1", "color": "#d93f0b"},
              {"name": "p2", "color": "#fbca04"},
              {"name": "p3", "color": "#0e8a16"},
          ]
          label_names = [x["name"] for x in LABELS]
          whitelist = set(label_names)

          def build_system_prompt():
              return (
                  "你是一个 issue 分类助手，服务于仓库「prompt_generator」——一个基于 "
                  "TypeScript/React（302.AI 开源）的「AI 提示词专家」前端。它会将简单提示语 "
                  "改写为 CO-STAR、CRISPE、QStar(Q*)、变分法、Meta Prompting、CoT 思维链、"
                  "微软优化法、RISE、DRAW(AI 绘画) 等结构的高质量提示词，支持在线修改与测试、"
                  "多语言（中文/English/日本語）切换。\n\n"
                  "你的任务：仅基于下方白名单为当前 issue 选出最贴切的若干标签，然后只输出一个"
                  " JSON 数组（不要输出任何其它文字、注释、Markdown 代码块或解释）。\n"
                  "可选标签（务必逐字使用，勿自创、勿改拼写、勿夹带描述或命令）：\n"
                  + "\n".join("- " + n for n in label_names) +
                  "\n\n规则：优先按 issue 性质/类型与仓库模块选类型与功能类标签；对确需人工优先"
                  "介入的 issue 再从优先级标签（p0/p1/p2/p3）中选一条。仅当 issue 确为重复、"
                  "无效或不采纳时才用 duplicate/invalid/wontfix；正常 issue 不得误打。"
                  " 输出示例：[\"bug\",\"ui\"]"
              )

          # 只读送入的 issue 标题/正文（截断，避免超大正文触发异常/超限）
          title = (os.environ.get("ISSUE_TITLE", "") or "")[:2000]
          body = (os.environ.get("ISSUE_BODY", "") or "")[:8000]

          user_content = (
              f"请为以下 GitHub Issue 分类，issue #{os.environ.get('ISSUE_NUMBER', '')}。\n"
              f"标题：{title}\n正文：\n{body}\n\n只输出 JSON 标签数组。"
          )

          endpoint = os.environ["AI_API_ENDPOINT"].rstrip("/")
          payload = {
              "model": os.environ["AI_MODEL_NAME"],
              "messages": [
                  {"role": "system", "content": build_system_prompt()},
                  {"role": "user", "content": user_content},
              ],
              "temperature": 0,
          }
          req = urllib.request.Request(
              endpoint + "/chat/completions",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + os.environ["AI_API_TOKEN"],
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=180) as resp:
              data = json.loads(resp.read().decode("utf-8"))
          content = data["choices"][0]["message"]["content"]

          # 稳健解析：仅取 JSON 数组片段
          m = re.search(r"\[[^\]]*\]", content, re.S)
          chosen = []
          if m:
              try:
                  arr = json.loads(m.group(0))
                  chosen = [str(x) for x in arr]
              except Exception:
                  chosen = []
          # 白名单过滤：仅保留与清单逐字一致的标签，丢弃一切自创/注入字符串
          chosen = [c for c in chosen if c in whitelist]
          seen, result = set(), []
          for c in chosen:
              if c not in seen:
                  seen.add(c)
                  result.append(c)

          # 结果写入共享临时文件，供阶段二确定性打标读取
          out_path = "/tmp/ai_labels.txt"
          with open(out_path, "w", encoding="utf-8") as o:
              o.write("\n".join(result))
          print("AI 分类完成，命中白名单标签：" + (", ".join(result) if result else "(无)"))
          PY

      # -------------------------------------------------------------------------
      # 阶段二：确定性打标（普通 bash + gh，不解析不可信文本的任何指令）
      #   遍历白名单常量，仅对「AI 建议 且 命中白名单」的标签，按常量颜色确定性
      #   创建（如仓库缺失）并应用到 issue；颜色一律取自常量清单，与 AI 输出无关。
      # -------------------------------------------------------------------------
      - name: '确定性应用标签到 Issue（白名单校验后打标）'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          ISSUE_NUMBER: '${{ github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
        run: |
          set -euo pipefail
          # 颜色常量（名称→颜色，仅用于确定性创建缺失标签；值硬编码、与 AI 输出无关）
          declare -A COLOR=(
            [bug]="#d73a4a" [enhancement]="#a2eeef" [feature]="#1d76db"
            [documentation]="#0075ca" [security]="#b60205" [question]="#d876e3"
            [good first issue]="#1f883d" [help wanted]="#6f42c1" [duplicate]="#cfd3d7"
            [invalid]="#ffffff" [wontfix]="#6e5494" [prompt]="#008672"
            [framework]="#fbca04" [custom]="#7e4aff" [ui]="#7057ff" [models]="#5319e7"
            [config]="#e4e669" [i18n]="#1d76db" [agent]="#d35400" [ai-audit]="#ededed"
            [docker]="#0969da" [deploy]="#0f7fb8" [ci]="#8250df" [license]="#bfd4f2"
            [supply-chain]="#168700" [code-scanning]="#e99695"
            [p0]="#b60205" [p1]="#d93f0b" [p2]="#fbca04" [p3]="#0e8a16"
          )
          # 标签白名单（仅这些键会被打标，其余一律忽略）
          declare -A WHITELIST=(
            [bug]=1 [enhancement]=1 [feature]=1 [documentation]=1 [security]=1
            [question]=1 [good first issue]=1 [help wanted]=1 [duplicate]=1
            [invalid]=1 [wontfix]=1 [prompt]=1 [framework]=1 [custom]=1 [ui]=1
            [models]=1 [config]=1 [i18n]=1 [agent]=1 [ai-audit]=1 [docker]=1
            [deploy]=1 [ci]=1 [license]=1 [supply-chain]=1 [code-scanning]=1
            [p0]=1 [p1]=1 [p2]=1 [p3]=1
          )

          # 读取阶段一输出（每一行一个标签名，已由 python 白名单过滤）
          mapfile -t suggested < /tmp/ai_labels.txt

          # 仓库现存标签集合（用于避免重复创建）
          repo_labels=$(gh label list --json name --jq '.[].name' 2>/dev/null || true)

          apply=()
          for lbl in "${suggested[@]:-}"; do
            [ -n "$lbl" ] || continue
            # 仅接受白名单内的确切标签名（杜绝注入字符串进入 gh 参数）
            [ -n "${WHITELIST[$lbl]:-}" ] || { echo "跳过白名单外标签: $lbl"; continue; }
            # 若仓库中尚不存在，按常量颜色确定性创建（颜色不受 AI 输出影响）
            if ! echo "$repo_labels" | grep -qxF "$lbl"; then
              echo "确定性创建缺失标签: $lbl (${COLOR[$lbl]})"
              gh label create "$lbl" --color "${COLOR[$lbl]}" >/dev/null
            fi
            apply+=("$lbl")
          done

          if [ "${#apply[@]}" -gt 0 ]; then
            echo "应用标签到 issue #${ISSUE_NUMBER}: ${apply[*]}"
            label_arg="$(IFS=,; echo "${apply[*]}")"
            gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" --add-label "$label_arg"
          else
            echo '无白名单命中的标签可应用（AI 未给出合法建议或本 issue 无需打标）。'
          fi

      # 分类失败时评论，便于维护者定位（引用 action 日志）
      - name: '发布 Issue 分类失败评论'
        if: |-
          ${{ failure() && steps.ai_triage.outcome == 'failure' }}
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd' # v7
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          script: |-
            github.rest.issues.createComment({
              owner: '${{ github.repository }}'.split('/')[0],
              repo: '${{ github.repository }}'.split('/')[1],
              issue_number: '${{ github.event.issue.number }}',
              body: 'Issue 自动分类存在问题。请检查 [action 日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) 了解详情。'
            })
