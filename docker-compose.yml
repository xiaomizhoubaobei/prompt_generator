version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_SHOW_BRAND: ${VITE_APP_SHOW_BRAND:-false}
        VITE_APP_MODEL_NAME: ${VITE_APP_MODEL_NAME:-gpt-4o}
        VITE_APP_REGION: ${VITE_APP_REGION:-0}
        VITE_APP_LOCALE: ${VITE_APP_LOCALE:-zh}
        VITE_APP_API_URL: ${VITE_APP_API_URL:-https://api.302.ai}
        VITE_APP_OFFICIAL_WEBSITE_URL_CHINA: ${VITE_APP_OFFICIAL_WEBSITE_URL_CHINA:-https://302ai.cn/}
        VITE_APP_OFFICIAL_WEBSITE_URL_GLOBAL: ${VITE_APP_OFFICIAL_WEBSITE_URL_GLOBAL:-https://302.ai/}
        VITE_APP_UPLOAD_API_URL: ${VITE_APP_UPLOAD_API_URL:-https://dash-api.302.ai/gpt/api/upload/gpt/image}
    image: 302-prompt-generator:latest
    container_name: 302-prompt-generator
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    environment:
      - TZ=Asia/Shanghai
      # ===== 服务端 BFF 配置（仅供后端进程读取，绝不注入前端）=====
      # 上游 AI 网关地址
      - UPSTREAM_API_URL=${UPSTREAM_API_URL:-https://api.302.ai}
      # 真实上游 API Key：仅服务端持有，前端零密钥；请在 .env 或部署平台注入
      - UPSTREAM_API_KEY=${UPSTREAM_API_KEY:-}
      # 短期会话签名密钥：部署时应设置为足够随机的强口令
      - SESSION_SECRET=${SESSION_SECRET:-}
      # BFF 监听端口（容器内部）
      - SERVER_PORT=${SERVER_PORT:-3001}
      # ===== 滥用防护限流（可选调优，默认值见注释）=====
      - RATE_LIMIT_SESSION_MAX=${RATE_LIMIT_SESSION_MAX:-10}
      - RATE_LIMIT_REFRESH_MAX=${RATE_LIMIT_REFRESH_MAX:-20}
      - RATE_LIMIT_PROXY_MAX=${RATE_LIMIT_PROXY_MAX:-30}
      - PROXY_MAX_CONCURRENT=${PROXY_MAX_CONCURRENT:-5}
      - PROXY_MAX_BODY_BYTES=${PROXY_MAX_BODY_BYTES:-5242880}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - prompt-network

networks:
  prompt-network:
    driver: bridge
